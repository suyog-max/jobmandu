<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Profile - JobMandu</title>
     <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/JobMandu.jpg') }}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='form.css') }}">
</head>
<body>
<nav>
    <div class="nav-container">
        <a href="index" class="logo-link">
    <img src="{{ url_for('static', filename='assets/JobMandu.jpg') }}" alt="JobMandu Logo" class="nav-logo">
    <span class="logo-text">JobMandu</span>
</a>
        <div class="nav-links">
           <a href="index"><i class='bx bx-home-alt'></i> Home</a>
            <a href="jobs">Find Jobs</a>
            <a href="categories">Categories</a>
            <a href="aboutus">About Us</a>
            <a href="form" class="active"> Upload Resume</a>
            <a href="login">Sign In</a>
        </div>
    </div>
</nav>

<div class="form-wrapper">
    <div class="form-container">
        <div class="form-header">
            <h2>Job Seeker Profile</h2>
            <p>Please fill in your details to help employers find you.</p>
        </div>
<form action="{{ url_for('form') }}" method="POST" enctype="multipart/form-data">
    <div class="input-row">
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" name="full_name" placeholder="Enter your full name" required>
        </div>
        <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" name="phonenumber" placeholder="+977-98XXXXXXXX" required>
        </div>
    </div>

    <div class="input-row">
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
            <label>Citizenship or Verified Government ID Number</label>
            <input type="text" name="id_number" placeholder="Enter your number" required>
        </div>
    </div>

    <div class="input-row">
        <div class="input-group">
            <label>Current Address</label>
            <input type="text" name="current_address" placeholder="e.g. Kathmandu, Nepal" required>
        </div>
        <div class="input-group">
            <label>Total Experience</label>
            <select name="total_experience" title="Total Experience">
                <option>Fresher</option>
                <option>1-2 Years</option>
                <option>3-5 Years</option>
                <option>5+ Years</option>
            </select>
        </div>
    </div>

    <div class="input-group">
        <label>Professional Bio</label>
        <textarea name="professional_bio" rows="4" placeholder="Briefly describe your skills and career goals..." required></textarea>
    </div>

    <div class="resume-upload">
        <label>Upload CV/Resume</label>
        <div class="upload-box">
            <i class='bx bx-cloud-upload'></i>
            <input type="file" id="cv-file" name="resume_file" accept=".jpg,.jpeg,.pdf,.doc,.docx">
            <label for="cv-file" class="file-label">Click to choose file</label>
        </div>
    </div>

    <button type="submit" class="submit-btn">Save Profile</button>
</form>
    </div>
</div>
<footer>
    <div class="footer-content">
        <p>&copy; 2026 JobMandu. All rights reserved.</p>
        <div class="social-icons">
            <a href="#"><i class='bx bxl-facebook-circle'></i></a>
            <a href="#"><i class='bx bxl-linkedin-square'></i></a>
            <a href="#"><i class='bx bxl-instagram'></i></a>
        </div>
    </div>
</footer>
</body>
</html>
