<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JobMandu</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/JobMandu.jpg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="index" class="logo-link">
            <img src="{{ url_for('static', filename='assets/JobMandu.jpg') }}" alt="JobMandu Logo" class="nav-logo">
            <span class="logo-text">JobMandu</span>
        </a>
        <div class="nav-links">
            <a href="index"><i class='bx bx-home-alt'></i> Home</a>
            <a href="jobs">Find Jobs</a>
            <a href="categories">Categories</a>
            <a href="aboutus">About Us</a>
            <a href="form">Upload Resume</a>
            <a href="login" class="active">Sign In</a>
        </div>
    </div>
</nav>

<div class="register-page-container">
    <div class="wrapper">
        <form action="#" method="post">
            {{ form.hidden_tag() }}
            <h1>Register</h1>
            
            <div class="input-box">
                <input type="text" id="user_name" name="user_name" placeholder="Username" required>
                <i class='bx bxs-user-pin'></i>
            </div>

            <div class="input-box">
                <input type="email" id="email" name="email" placeholder="Email Address" required>
                <i class='bx bxs-envelope'></i>
            </div>

            <div class="input-box">
                <input type="password" id="password" name="password" placeholder="Password" required>
                <i class='bx bxs-lock'></i>
            </div>

            <div class="input-box">
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
                <i class='bx bxs-lock-alt'></i>
            </div>

            <button type="submit" class="btn">Register</button>

            <div class="register-link">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>

            <button type="button" class="home-btn" onclick="history.back()">
                <i class='bx bx-arrow-back'></i> Back
            </button>
        </form>
    </div>
</div>
</body>
</html>
